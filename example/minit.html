<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<!-- The above 4 meta tags *must* come first in the head. -->

	<title>{{project.title}} {{project.version}}</title>
	<style type='text/css'>
	/* Minit host: the game must fill the viewport with no chrome or scrollbars.
	   The host keeps the iframe hidden until the game calls minit.loading_done(),
	   so the Defold loader runs behind the host's own splash. */
	html, body {
		position: fixed;
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 0;
		overflow: hidden;
		background: #1c1f2e;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		display: flex;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	#canvas-container {
		position: relative;
		width: 100%;
		height: 100%;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		height: 100%;
		display: block;
	}

	canvas:focus, canvas:active {
		outline: none;
		border: 0;
		-moz-outline-style: none;
	}

	body, div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
	}

	{{{DEFOLD_CUSTOM_CSS_INLINE}}}
	</style>
</head>

<body>
	<div id="app-container" class="canvas-app-container">
		<div id="webgl-not-supported" style="display: none; margin: 3em;">
			<h1>WebGL not supported</h1>
			<p>WebGL is required to run this game.</p>
		</div>
		<div id="canvas-container" class="canvas-app-canvas-container">
			<canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="{{display.width}}" height="{{display.height}}"></canvas>
		</div>
	</div>
	<script>
		// Fallback for old browsers without globalThis (pre Chrome 71).
		if (typeof globalThis === 'undefined') {
			window.globalThis = window;
		}
	</script>
	<script id='engine-loader' type='text/javascript' src="dmloader.js"></script>
	<script id='engine-setup' type='text/javascript'>
		// Configure engine startup here via CUSTOM_PARAMETERS if needed.
	</script>
	<script id='engine-start' type='text/javascript'>
		EngineLoader.load("canvas", "{{exe-name}}");
	</script>
</body>
</html>
